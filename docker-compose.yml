# Docker Compose for local development.
# Starts Redis on port 6379 for running integration tests.
services:
  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    # Persist data across restarts (optional, nice for dev)
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  redis-data:
